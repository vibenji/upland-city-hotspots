name: Trove Upland feasibility probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/trove-feasibility.yml]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous Upland map access
        shell: bash
        run: |
          node --input-type=module <<'PROBE'
          // Wibenji — temporary Trove feasibility experiment.
          const results=[];
          async function probe(name,path,validate){
            const start=Date.now();
            try{
              const response=await fetch('https://api.prod.upland.me/api/'+path,{headers:{accept:'application/json'},credentials:'omit',redirect:'error',signal:AbortSignal.timeout(60000)});
              const text=await response.text();
              let data;try{data=JSON.parse(text)}catch{}
              const result={name,status:response.status,elapsedMs:Date.now()-start,bytes:Buffer.byteLength(text)};
              if(!response.ok)throw Object.assign(Error('HTTP '+response.status),{result});
              Object.assign(result,validate(data));results.push({...result,ok:true});
            }catch(error){results.push({...error.result,name,ok:false,elapsedMs:Date.now()-start,error:error.message});}
          }
          await probe('neighborhood','neighborhood',data=>{
            if(!Array.isArray(data)||!data.some(r=>r.boundaries&&r.city_id))throw Error('Missing neighborhood boundaries');
            return {rows:data.length,cities:new Set(data.map(r=>r.city_id)).size};
          });
          const params=new URLSearchParams({north:'34.181',south:'34.177',east:'-118.389',west:'-118.395',marker:'true'});
          for(let i=1;i<=2;i++){
            await new Promise(resolve=>setTimeout(resolve,1000));
            await probe('map-'+i,'map?'+params,data=>{
              const rows=Array.isArray(data)?data:data?.properties;
              if(!Array.isArray(rows)||!rows.length||rows.some(r=>r.prop_id==null||!Array.isArray(r.models)))throw Error('Missing parcels or readable models');
              const sources=rows.flatMap(r=>r.models).filter(m=>m.modelType==='plant'||m.modelType==='building'&&m.subType==='service'&&m.constructionStatus==='completed');
              return {rows:rows.length,sourceModels:sources.length,coordinates:rows.filter(r=>Number.isFinite(Number(r.centerlat))&&Number.isFinite(Number(r.centerlng))).length};
            });
          }
          console.log(JSON.stringify({probe:'trove-github-feasibility-v1',at:new Date().toISOString(),githubActions:process.env.GITHUB_ACTIONS==='true',runnerOS:process.env.RUNNER_OS??process.platform,authenticated:false,results},null,2));
          if(results.some(r=>!r.ok))process.exitCode=1;
          PROBE
