name: Verify city scan service
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Test queue, snapshot retention, fees and all three modes
        run: node --test source/*.test.mjs
