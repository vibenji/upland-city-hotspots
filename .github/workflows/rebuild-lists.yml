name: Fast city basis fees
on:
  push:
    branches: [main]
    paths: [.github/workflows/rebuild-lists.yml]
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily ordered city scans']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: daily-city-scan-service
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  LIVE_PROCESSOR: 'true'
jobs:
  plan:
    name: Plan basis and measure fee throughput
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.recovery.outputs.matrix }}
      has_work: ${{ steps.recovery.outputs.has_work }}
      concurrency: ${{ steps.measure.outputs.concurrency }}
      interval: ${{ steps.measure.outputs.interval }}
      retry_at: ${{ steps.measure.outputs.retry_at }}
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Verify publication and ranking policy
        run: node --test source/*.test.mjs
      - name: Find missing maps, lists or incomplete/stale candidate fees
        id: recovery
        working-directory: source
        run: node scan-queue.mjs recovery-plan
      - name: Measure three bounded request rates on this runner
        id: measure
        working-directory: source
        run: node measure-fees.mjs
  city:
    name: Basis fees · ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.has_work == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Load basis fees and preserve complete map for ${{ matrix.name }}
        working-directory: source
        env:
          CITY_IDS: ${{ matrix.id }}
          FEE_CONCURRENCY: ${{ needs.plan.outputs.concurrency }}
          FEE_INTERVAL_MS: ${{ needs.plan.outputs.interval }}
          FEE_TIME_BUDGET_MS: '300000'
          FEE_MAX_REQUESTS: '1000'
          FEE_RESUME_AT: ${{ needs.plan.outputs.retry_at }}
        run: |
          node -e "setTimeout(() => {}, Math.max(0, Number(process.env.FEE_RESUME_AT) - Date.now()))"
          node scan-queue.mjs repair
      - name: Keep city measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repair-${{ matrix.id }}-measurements
          path: |
            source/reports/**/metrics.json
            source/reports/**/requests.json
          retention-days: 7
          if-no-files-found: ignore
  report:
    name: Publish basis readiness for every city
    needs: [plan, city]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Summarize published basis and full-city coverage separately
        working-directory: source
        run: node basis-report.mjs
      - name: Keep machine and human readable verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: city-verification-report
          path: source/reports/basis-status/basis-status.*
          retention-days: 7
          if-no-files-found: warn
