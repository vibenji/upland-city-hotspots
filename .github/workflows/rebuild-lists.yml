name: Complete city fees and verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/rebuild-lists.yml]
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily ordered city scans']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: daily-city-scan-service
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  LIVE_PROCESSOR: 'true'
jobs:
  plan:
    name: Plan city fees and repairs
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.recovery.outputs.matrix }}
      has_work: ${{ steps.recovery.outputs.has_work }}
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Verify publication and ranking policy
        run: node --test source/*.test.mjs
      - name: Find missing maps, lists or incomplete/stale candidate fees
        id: recovery
        working-directory: source
        run: node scan-queue.mjs recovery-plan
      - name: Publish initial city verification report
        continue-on-error: true
        working-directory: source
        run: node status-report.mjs
  city:
    name: Fees & repair · ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.has_work == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Load all candidate fees and repair ${{ matrix.name }}
        working-directory: source
        env:
          CITY_IDS: ${{ matrix.id }}
        run: node scan-queue.mjs repair
      - name: Keep city measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repair-${{ matrix.id }}-measurements
          path: |
            source/reports/**/metrics.json
            source/reports/**/requests.json
          retention-days: 7
          if-no-files-found: ignore
  report:
    name: Verify all cities and publish report
    needs: [plan, city]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Verify published map/list hashes and every candidate fee
        working-directory: source
        run: node status-report.mjs
      - name: Keep machine and human readable verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: city-verification-report
          path: source/reports/audit/status-report.*
          retention-days: 7
          if-no-files-found: warn
