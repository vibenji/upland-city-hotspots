name: Daily ordered city scans
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-city-scan-service
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  LIVE_PROCESSOR: 'true'
jobs:
  plan:
    name: Plan city scans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Verify queue policy
        run: node --test source/*.test.mjs
      - name: Discover all published cities
        id: discover
        working-directory: source
        run: node scan-queue.mjs discover
  bakersfield:
    name: Bakersfield
    needs: [plan]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Scan Bakersfield and publish mode lists
        working-directory: source
        env:
          CITY_IDS: '9'
        run: node scan-queue.mjs scan
      - name: Keep city measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: city-9-measurements
          path: |
            source/reports/**/metrics.json
            source/reports/**/requests.json
          retention-days: 7
          if-no-files-found: ignore
  los-angeles:
    name: Los Angeles
    needs: [plan, bakersfield]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Scan Los Angeles and publish mode lists
        working-directory: source
        env:
          CITY_IDS: '32'
        run: node scan-queue.mjs scan
      - name: Keep city measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: city-32-measurements
          path: |
            source/reports/**/metrics.json
            source/reports/**/requests.json
          retention-days: 7
          if-no-files-found: ignore
  las-vegas:
    name: Las Vegas
    needs: [plan, los-angeles]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Scan Las Vegas and publish mode lists
        working-directory: source
        env:
          CITY_IDS: '35'
        run: node scan-queue.mjs scan
      - name: Keep city measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: city-35-measurements
          path: |
            source/reports/**/metrics.json
            source/reports/**/requests.json
          retention-days: 7
          if-no-files-found: ignore
  remaining-cities:
    name: ${{ matrix.name }}
    needs: [plan, las-vegas]
    if: ${{ always() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Read public source at this commit
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/vibenji/upland-city-hotspots.git
          git -C source fetch --depth 1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Scan ${{ matrix.name }} and publish mode lists
        working-directory: source
        env:
          CITY_IDS: ${{ matrix.id }}
        run: node scan-queue.mjs scan
      - name: Keep city measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: city-${{ matrix.id }}-measurements
          path: |
            source/reports/**/metrics.json
            source/reports/**/requests.json
          retention-days: 7
          if-no-files-found: ignore
